[project]
name = "ha-rename"
version = "0.1.0"
description = "Bulk-rename Home Assistant entities via the WebSocket API"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Nelson", email = "1295690+sfelf@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["home-assistant", "cli", "entity-registry", "rename"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "keyring>=25.7.0",
    "shtab>=1.12.1",
    "websockets>=17.2",
]

[project.urls]
Homepage = "https://github.com/sfelf/home-assistant-rename"
Issues = "https://github.com/sfelf/home-assistant-rename/issues"

[project.scripts]
ha-rename = "ha_rename.cli:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
addopts = "--cov=ha_rename --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
